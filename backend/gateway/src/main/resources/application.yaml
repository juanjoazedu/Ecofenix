server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200,http://localhost:3000, http://localhost:5173"
            allowedMethods: "*"  # GET, POST, PUT, DELETE, etc.
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        - id: ms-items
          uri: lb://MS-ITEMS
          predicates:
            - Path=/api/items/**
            - Path=/api/categories/**
          filters:
            - StripPrefix=1
        - id: ms-carts
          uri: lb://MS-CARTS
          predicates:
            - Path=/api/carts/**
          filters:
            - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true