server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        web flux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:4200"
                  - "http://localhost:3000"
                  - "http://localhost:5173"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600

          routes:
            - id: ms-items
              uri: lb://MS-ITEMS
              predicates:
                - Path=/api/items/**,/api/categories/**
              filters:
                - StripPrefix=1
            - id: ms-carts
              uri: lb://MS-CARTS
              predicates:
                - Path=/api/carts/**
              filters:
                - StripPrefix=1
            - id: ms-transactions
              uri: lb://MS-TRANSACTIONS
              predicates:
                - Path=/api/orders/**
              filters:
                - StripPrefix=1
            - id: ms-payments
              uri: lb://MS-PAYMENTS
              predicates:
                - Path=/api/payments/**
              filters:
                - StripPrefix=1
            - id: ms-users
              uri: lb://MS-USERS
              predicates:
                - Path=/api/auth/**,/api/users/**,/api/roles/**
              filters:
                - StripPrefix=0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true