server:
  port: ${PORT:8083}

spring:
  application:
    name: ms-transactions
  datasource:
    url: jdbc:mysql://localhost:3306/ecofenix_transactions?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ecofenix_temp
    password: 1234567890
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 5000
#          MS-ITEMS:
#            connect-timeout: 3000
#            read-timeout: 3000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}